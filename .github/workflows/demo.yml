name: Direct HTTP demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 demo.py
      - run: python3 demo.py --compression none
      - name: Service diagnostics
        if: failure()
        run: docker compose --profile local logs --tail 100
      - name: Stop demo services
        if: always()
        run: docker compose --profile local down --volumes
